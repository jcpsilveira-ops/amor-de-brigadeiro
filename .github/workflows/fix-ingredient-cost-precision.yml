name: Fix ingredient cost precision

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply precision fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/api.ts")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '  dinheiro,\n} from "./domain";',
                  '  dinheiro,\n  dinheiro4,\n} from "./domain";',
              ),
              (
                  '  custoUnitario: dinheiro(Number(r.custo_unitario)),',
                  '  custoUnitario: dinheiro4(Number(r.custo_unitario)),',
              ),
              (
                  '          custo_unitario: dinheiro(input.custoUnitario),',
                  '          custo_unitario: dinheiro4(input.custoUnitario),',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected text not found: {old!r}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify and commit
        run: |
          if git diff --quiet -- src/lib/api.ts; then
            echo "No changes needed."
            exit 0
          fi

          git diff --check
          grep -n "dinheiro4" src/lib/api.ts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api.ts
          git commit -m "Fix ingredient unit cost precision"
          git push

      - name: Remove temporary workflow
        if: ${{ success() }}
        run: |
          if [ -f .github/workflows/fix-ingredient-cost-precision.yml ]; then
            git rm .github/workflows/fix-ingredient-cost-precision.yml
            git commit -m "Remove temporary precision fix workflow"
            git push
          fi
